<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Spec-Driven Development 教學</title>
<style>
  :root {
    --bg: #0d1020;
    --bg2: #151a33;
    --panel: #161b31;
    --line: #2a3156;
    --text: #e8ebf7;
    --muted: #97a0c3;
    --accent: #7c9cff;
    --good: #5ee3b0;
    --bad: #ff7a8a;
    --warm: #ffb86b;
    --sans: 'WenQuanYi Zen Hei', 'DejaVu Sans', 'Noto Color Emoji', sans-serif;
    --mono: 'DejaVu Sans Mono', 'WenQuanYi Zen Hei Mono', 'Noto Color Emoji', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: radial-gradient(1200px 800px at 80% -10%, #1d2550 0%, transparent 60%),
      radial-gradient(900px 700px at -10% 110%, #122a3a 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  #stage { position: absolute; inset: 0; }
  #content { position: absolute; left: 140px; right: 140px; top: 120px; bottom: 215px; }

  /* 頂部：品牌 + 五步進度 */
  #top { position: absolute; top: 44px; left: 140px; right: 140px; display: flex; align-items: center; justify-content: space-between; }
  #brand { font-size: 24px; color: var(--muted); letter-spacing: 1px; }
  #brand b { color: var(--accent); font-weight: normal; }
  #stages { display: flex; gap: 10px; }
  .pill { padding: 8px 18px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); font-size: 22px; }
  .pill.done { border-color: #2f5a4d; color: var(--good); }
  .pill.on { border-color: var(--accent); background: var(--accent); color: #0d1020; }

  /* 底部字幕 + 進度條 */
  #sub { position: absolute; left: 160px; right: 160px; bottom: 62px; min-height: 100px; display: flex; align-items: center; justify-content: center; }
  #sub span { background: rgba(5, 7, 16, 0.78); border: 1px solid #262c4b; padding: 16px 30px; border-radius: 14px; font-size: 38px; line-height: 1.45; text-align: center; }
  #bar { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--accent); }

  .kicker { font-size: 28px; color: var(--accent); letter-spacing: 2px; margin-bottom: 14px; }
  h1 { font-size: 64px; font-weight: normal; margin-bottom: 44px; }
  .quote { font-size: 44px; border-left: 8px solid var(--warm); padding: 14px 30px; margin-bottom: 44px; background: rgba(255, 184, 107, 0.07); border-radius: 0 14px 14px 0; }

  /* bullets */
  .items { display: flex; flex-direction: column; gap: 22px; }
  .item { display: flex; align-items: center; gap: 26px; font-size: 40px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 22px 30px; }
  .item .ic { font-size: 46px; width: 60px; text-align: center; }
  .items.compact { gap: 14px; }
  .items.compact .item { font-size: 36px; padding: 14px 28px; }
  .tone-bad .item { border-left: 8px solid var(--bad); }
  .tone-good .item { border-left: 8px solid var(--good); }

  /* title */
  .title-wrap { height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .title-wrap .big { font-size: 118px; line-height: 1.1; background: linear-gradient(90deg, #a8bbff, #5ee3b0); -webkit-background-clip: text; color: transparent; }
  .title-wrap .sm { font-size: 56px; margin-top: 30px; }
  .chips { display: flex; gap: 16px; margin-top: 50px; }
  .chip { font-size: 28px; padding: 10px 24px; border-radius: 999px; background: #1c2345; border: 1px solid var(--line); color: var(--muted); }

  /* flow */
  .flow { display: flex; align-items: stretch; gap: 0; margin-top: 60px; }
  .node { flex: 1; text-align: center; padding: 40px 10px; border-radius: 22px; background: var(--panel); border: 3px solid var(--line); }
  .node .n { font-size: 26px; color: var(--muted); }
  .node .en { font-size: 44px; margin: 10px 0; }
  .node .zh { font-size: 34px; color: var(--accent); }
  .node .d { font-size: 28px; color: var(--muted); margin-top: 18px; }
  .node.on { border-color: var(--accent); background: #1d2650; box-shadow: 0 0 60px rgba(124, 156, 255, 0.35); }
  .node.done { border-color: #2f5a4d; }
  .node.done .zh { color: var(--good); }
  .arrow { width: 60px; display: flex; align-items: center; justify-content: center; font-size: 44px; color: var(--muted); }
  .loop { margin-top: 40px; text-align: center; font-size: 32px; color: var(--warm); }

  /* file / terminal */
  .split { display: flex; gap: 50px; height: 100%; }
  .win { flex: 1.65; background: #0a0d1a; border: 2px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .win .tab { background: #12162b; padding: 14px 24px; font-family: var(--mono); font-size: 24px; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .code { padding: 20px 30px; font-family: var(--mono); font-size: 25px; line-height: 1.5; white-space: pre; }
  .code.dense { font-size: 22px; line-height: 1.42; }
  .code .h { color: var(--accent); }
  .code .li { color: var(--text); }
  .code .ac { color: var(--good); }
  .code .cm { color: var(--muted); }
  .notes { flex: 1; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
  .note { font-size: 34px; padding: 20px 26px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); line-height: 1.35; }
  .note.cur { border-color: var(--accent); }
  .note.strong { border-color: var(--warm); background: rgba(255, 184, 107, 0.08); }
  .stepbig { font-size: 30px; color: var(--accent); margin-bottom: 8px; letter-spacing: 2px; }
  .stephead { font-size: 54px; margin-bottom: 12px; }
  .you { color: var(--warm); }
  .agent { color: var(--text); }
  .done-l { color: var(--good); }

  /* repo */
  .tree { font-family: var(--mono); font-size: 34px; line-height: 1.6; white-space: pre; padding: 30px 40px; }

  /* outro */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .card { font-size: 40px; padding: 28px 34px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; display: flex; gap: 20px; align-items: center; }
  .card .num { font-size: 34px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #0d1020; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .closing { margin-top: 50px; font-size: 50px; text-align: center; color: var(--good); }
</style>
</head>
<body>
<div id="stage">
  <div id="top"><div id="brand"><b>SDD</b> × Coding Agent</div><div id="stages"></div></div>
  <div id="content"></div>
  <div id="sub"><span></span></div>
  <div id="bar"></div>
</div>
<script src="scenes.js"></script>
<script src="narration.cmn.js"></script>
<script>
  const STAGES = ['Specify', 'Plan', 'Tasks', 'Implement', 'Verify'];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

  // 喺 step k、過場進度 t 時，一個 `at` 元素嘅可見度
  const vis = (at, k, t) => (at < k ? 1 : at === k ? ease(t) : 0);
  const fx = (v) => `opacity:${v};transform:translateY(${(1 - v) * 24}px)`;

  // file / terminal 逐行打出：回傳每行嘅可見度
  function lineVis(at, k, t, n, j) {
    if (at < k) return 1;
    if (at > k) return 0;
    return clamp(t * n - j);
  }

  function hlLine(line) {
    const e = esc(line);
    if (/^#/.test(line)) return `<span class="h">${e}</span>`;
    if (/AC\d/.test(line) && /^- AC/.test(line)) return `<span class="ac">${e}</span>`;
    if (/^\s+\S/.test(line) && !/^- /.test(line)) return `<span class="li">${e}</span>`;
    return e;
  }

  const R = {
    title(s, k, t) {
      return `<div class="title-wrap">
        <div class="big" style="${fx(vis(0, k, t))}">${esc(s.title)}</div>
        <div class="sm" style="${fx(vis(0, k, clamp(t * 1.4 - 0.3)))}">${esc(s.subtitle)}</div>
        <div class="chips" style="${fx(vis(1, k, t))}">${s.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>
      </div>`;
    },
    bullets(s, k, t) {
      return `<div class="tone-${s.tone || 'none'}">
        <div class="kicker" style="${fx(vis(0, k, t))}">${esc(s.kicker || '')}</div>
        <h1 style="${fx(vis(0, k, t))}">${esc(s.title)}</h1>
        ${s.quote ? `<div class="quote" style="${fx(vis(0, k, clamp(t * 1.3 - 0.2)))}">${esc(s.quote)}</div>` : ''}
        <div class="items ${s.items.length > 4 ? 'compact' : ''}">${s.items
          .map((it) => `<div class="item" style="${fx(vis(it.at, k, t))}"><span class="ic">${it.icon}</span><span>${esc(it.text)}</span></div>`)
          .join('')}</div>
      </div>`;
    },
    flow(s, k, t) {
      const v0 = vis(0, k, t);
      const nodes = s.items
        .map((it, i) => {
          const cls = it.hl === k ? 'on' : it.hl < k ? 'done' : '';
          const node = `<div class="node ${cls}" style="${fx(v0)}"><div class="n">STEP ${i + 1}</div><div class="en">${it.en}</div><div class="zh">${it.zh}</div><div class="d">${esc(it.desc)}</div></div>`;
          return i ? `<div class="arrow" style="opacity:${v0}">→</div>${node}` : node;
        })
        .join('');
      const last = s.steps.length - 1;
      return `<div class="kicker" style="${fx(v0)}">${esc(s.kicker)}</div><h1 style="${fx(v0)}">${esc(s.title)}</h1>
        <div class="flow">${nodes}</div>
        <div class="loop" style="${fx(vis(last, k, t))}">↺ 每一步完成都要人 review，先至去下一步</div>`;
    },
    file(s, k, t) {
      const code = s.chunks
        .map((c) => c.lines.map((ln, j) => `<div style="opacity:${lineVis(c.at, k, t, c.lines.length, j)}">${hlLine(ln) || '&nbsp;'}</div>`).join(''))
        .join('');
      const nLines = s.chunks.reduce((a, c) => a + c.lines.length, 0);
      const notes = s.notes
        .map((n) => `<div class="note ${n.at === k ? 'cur' : ''} ${n.strong ? 'strong' : ''}" style="${fx(vis(n.at, k, t))}">${esc(n.text)}</div>`)
        .join('');
      const v0 = vis(0, k, t);
      return `<div class="split">
        <div class="win" style="opacity:${v0}"><div class="tab"><span class="dot" style="background:#ff6b6b"></span><span class="dot" style="background:#ffd166"></span><span class="dot" style="background:#5ee3b0"></span>&nbsp;${esc(s.file)}</div>
          <div class="code ${nLines > 16 ? 'dense' : ''}">${code}</div></div>
        <div class="notes"><div style="${fx(v0)}"><div class="stepbig">STEP ${s.stage}</div><div class="stephead">${STAGES[s.stage - 1]}</div></div>${notes}</div>
      </div>`;
    },
    terminal(s, k, t) {
      const body = s.chunks
        .map((c) => {
          const cls = c.kind === 'you' ? 'you' : c.kind === 'done' ? 'done-l' : 'agent';
          const prefix = c.kind === 'you' ? '&gt; ' : '  ';
          return (
            `<div style="height:${c.at ? 14 : 0}px"></div>` +
            c.lines.map((ln, j) => `<div class="${cls}" style="opacity:${lineVis(c.at, k, t, c.lines.length, j)}">${j === 0 || c.kind === 'you' ? prefix : '  '}${esc(ln)}</div>`).join('')
          );
        })
        .join('');
      const v0 = vis(0, k, t);
      const tips = [
        { at: 0, text: '① 讀邊幾份文件' },
        { at: 0, text: '② 只做一個 task' },
        { at: 0, text: '③ 做完點檢查' },
        { at: 0, text: '④ 幾時停低' },
        { at: 4, text: '一個 task · 一個 commit · 一次 review', strong: true },
      ];
      const notes = tips.map((n) => `<div class="note ${n.strong ? 'strong' : ''}" style="${fx(vis(n.at, k, clamp(t * 1.2 - 0.1)))}">${esc(n.text)}</div>`).join('');
      return `<div class="split">
        <div class="win" style="opacity:${v0}"><div class="tab"><span class="dot" style="background:#ff6b6b"></span><span class="dot" style="background:#ffd166"></span><span class="dot" style="background:#5ee3b0"></span>&nbsp;Terminal — coding agent</div>
          <div class="code" style="font-size:26px;white-space:pre-wrap">${body}</div></div>
        <div class="notes"><div style="${fx(v0)}"><div class="stepbig">STEP ${s.stage}</div><div class="stephead">${STAGES[s.stage - 1]}</div></div>${notes}</div>
      </div>`;
    },
    repo(s, k, t) {
      const v0 = vis(0, k, t);
      const rules = s.rules
        .map((r) => `<div class="${r.strong ? 'ac' : /^#/.test(r.text) ? 'h' : ''}" style="opacity:${vis(r.at, k, t)}">${esc(r.text)}</div>`)
        .join('');
      return `<div class="kicker" style="${fx(v0)}">${esc(s.kicker)}</div><h1 style="${fx(v0)};margin-bottom:30px">${esc(s.title)}</h1>
        <div class="split" style="height:auto">
          <div class="win" style="flex:1;${fx(v0)}"><div class="tab">📁 repo</div><div class="tree">${s.tree.map(esc).join('\n')}</div></div>
          <div class="win" style="flex:1.4;${fx(vis(1, k, t))}"><div class="tab">CLAUDE.md</div><div class="code" style="font-size:30px;line-height:1.75">${rules}</div></div>
        </div>`;
    },
    outro(s, k, t) {
      const v0 = vis(0, k, t);
      const cards = s.items
        .map((it, i) => `<div class="card" style="${fx(vis(it.at, k, clamp(t * 1.3 - (i % 2) * 0.3)))}"><span class="num">${i + 1}</span><span>${esc(it.text)}</span></div>`)
        .join('');
      return `<h1 style="${fx(v0)}">${esc(s.title)}</h1><div class="grid">${cards}</div>
        <div class="closing" style="${fx(vis(s.closing.at, k, t))}">${esc(s.closing.text)}</div>`;
    },
  };

  // 過場時長（秒）：打字類畫面比較長
  window.transitionFor = (si, k) => {
    const s = SCENES[si];
    if ((s.layout === 'file' || s.layout === 'terminal') && s.chunks.some((c) => c.at === k)) {
      const n = s.chunks.filter((c) => c.at === k).reduce((a, c) => a + c.lines.length, 0);
      return Math.min(2.0, 0.5 + n * 0.12);
    }
    return 0.6;
  };

  // 字幕文字：yue = scenes.js 嘅 steps；cmn = narration.cmn.js
  window.stepText = (si, k, lang) => (lang === 'cmn' ? CMN[si][k] : SCENES[si].steps[k]);

  window.renderFrame = (si, k, t, progress, lang = 'yue') => {
    const s = SCENES[si];
    $('#content').innerHTML = R[s.layout](s, k, t);
    $('#stages').innerHTML = s.stage
      ? STAGES.map((n, i) => `<span class="pill ${i + 1 === s.stage ? 'on' : i + 1 < s.stage ? 'done' : ''}">${i + 1}. ${n}</span>`).join('')
      : '';
    $('#sub span').textContent = stepText(si, k, lang);
    $('#sub').style.opacity = k === 0 ? ease(t * 2) : 1;
    $('#bar').style.width = `${progress * 100}%`;
  };

  // 喺瀏覽器直接打開時，用 ← → 手動翻頁預覽
  if (!navigator.webdriver) {
    let si = 0, k = 0;
    const lang = new URLSearchParams(location.search).get('lang') || 'yue';   // slides.html?lang=cmn
    const show = () => renderFrame(si, k, 1, (si + 1) / SCENES.length, lang);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { if (k < SCENES[si].steps.length - 1) k++; else if (si < SCENES.length - 1) { si++; k = 0; } }
      if (e.key === 'ArrowLeft') { if (k > 0) k--; else if (si > 0) { si--; k = SCENES[si].steps.length - 1; } }
      show();
    });
    show();
  }
</script>
</body>
</html>
